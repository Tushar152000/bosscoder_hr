name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate & Deploy to Cloud Run
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > /tmp/sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          gcloud config set project bosscoderplatformindia
          gcloud run deploy bosscoder-hr \
            --source=. \
            --region=asia-south1 \
            --quiet
          rm -f /tmp/sa-key.json

      - name: Print service URL
        run: |
          gcloud run services describe bosscoder-hr \
            --region=asia-south1 \
            --format="value(status.url)"
