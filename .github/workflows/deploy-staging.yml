name: Deploy to Staging

on:
  push:
    branches: [feature/attendanceSystem]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate & Deploy to Cloud Run (Staging)
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > /tmp/sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json
          gcloud config set project bosscoderplatformindia
          gcloud run deploy bosscoder-hr-staging \
            --source=. \
            --region=asia-south1 \
            --quiet
          rm -f /tmp/sa-key.json

      - name: Print staging URL
        run: echo "Staging → https://hr-staging.bosscoderacademy.com"
